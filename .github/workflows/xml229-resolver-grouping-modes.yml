name: XML229 Resolver POS PS Root Regression

on:
  pull_request:
    paths:
      - 'tabs/xml-cii-2019-standalone/**'
      - 'docs/tabs/xml-cii-2019-standalone/**'
      - 'converters/scripts/xml229_prefinal_restraint_source.py'
      - 'converters/scripts/xml229_prefinal_restraints.py'
      - 'docs/converters/scripts/xml229_prefinal_restraint_source.py'
      - 'docs/converters/scripts/xml229_prefinal_restraints.py'
      - 'tests/xml-cii-resolver-grouping-modes.test.mjs'
      - 'tests/test_xml229_resolver_grouping_modes.py'
      - '.github/workflows/xml229-resolver-grouping-modes.yml'
  workflow_dispatch:

jobs:
  grouping-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JavaScript source syntax
        run: |
          node --check tabs/xml-cii-2019-standalone/xml-cii-trace-resolution-ledger.js
          node --check tabs/xml-cii-2019-standalone/xml-cii-resolver-match-policy.js
          node --check tabs/xml-cii-2019-standalone/xml-cii-resolver-json-trace.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-json-trace.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events.js
      - name: Validate native source syntax
        run: |
          python -m py_compile converters/scripts/xml229_prefinal_restraint_source.py converters/scripts/xml229_prefinal_restraints.py
      - name: Run POS PS Root JS tests
        run: node --test tests/xml-cii-resolver-grouping-modes.test.mjs
      - name: Run POS PS Root native tests
        run: python -m unittest discover -s tests -p 'test_xml229_resolver_grouping_modes.py' -v
      - name: Verify source and Pages mirrors
        run: |
          diff -u tabs/xml-cii-2019-standalone/xml-cii-resolver-match-policy.js docs/tabs/xml-cii-2019-standalone/xml-cii-resolver-match-policy.js
          diff -u tabs/xml-cii-2019-standalone/xml-cii-trace-resolution-ledger.js docs/tabs/xml-cii-2019-standalone/xml-cii-trace-resolution-ledger.js
          diff -u tabs/xml-cii-2019-standalone/xml-cii-resolver-json-trace.js docs/tabs/xml-cii-2019-standalone/xml-cii-resolver-json-trace.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-json-trace.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-resolver-json-trace.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-events.js
          diff -u converters/scripts/xml229_prefinal_restraint_source.py docs/converters/scripts/xml229_prefinal_restraint_source.py
          diff -u converters/scripts/xml229_prefinal_restraints.py docs/converters/scripts/xml229_prefinal_restraints.py
