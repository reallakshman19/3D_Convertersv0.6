name: XML CII Standalone source ownership and audit regression
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tabs/xml-cii-2019-standalone/xml-cii-active-restraint-*'
      - 'docs/tabs/xml-cii-2019-standalone/xml-cii-active-restraint-*'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-converter-failure-diagnostic.mjs'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-converter-failure-diagnostic.mjs'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-dom.js'
      - 'docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-dom.js'
      - 'tests/xml-cii-active-restraint-coverage.test.mjs'
      - 'tests/xml-cii-glrd-source-gap-custody.test.mjs'
      - 'tests/xml-cii-active-restraint-audit.test.mjs'
      - 'tests/xml-cii-active-intake-gate.test.mjs'
      - 'tests/xml-cii-restraint-audit-panel.test.mjs'
      - 'tests/xml229-native-lineage-diagnostic-codes.test.mjs'
      - '.github/workflows/xmlcii-source-ownership-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-source-coverage:
    name: strict-source-coverage (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact checked-out candidate
        run: |
          echo "SOURCE_COVERAGE_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify current and served audit/diagnostic/download bytes
        run: |
          diff -u tabs/xml-cii-2019-standalone/xml-cii-active-restraint-coverage.js docs/tabs/xml-cii-2019-standalone/xml-cii-active-restraint-coverage.js
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-converter-failure-diagnostic.mjs docs/tabs/xml-cii-2019-standalone/ui-adapted/xml229-native-converter-failure-diagnostic.mjs
          diff -u tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-dom.js docs/tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-dom.js
          diff -u converters/xml-cii2019-core/branch-format-extraction.js docs/converters/xml-cii2019-core/branch-format-extraction.js
      - name: Run source omission, ownership, audit and native typed-error regressions
        run: |
          node --experimental-vm-modules --test \
            tests/xml-cii-active-restraint-coverage.test.mjs \
            tests/xml-cii-glrd-source-gap-custody.test.mjs \
            tests/xml-cii-active-restraint-audit.test.mjs \
            tests/xml-cii-active-intake-gate.test.mjs \
            tests/xml-cii-restraint-audit-panel.test.mjs \
            tests/xml229-native-lineage-diagnostic-codes.test.mjs
